<style>
/* Matchday broadcast look: black masthead with the RAL rainbow, bright paper body, condensed numerals, hard edges */
:root{
  --paper:#eef0f3;--card:#ffffff;--ink:#0d1117;--sub:#5d6675;--rule:#dde1e7;--soft:#f5f6f8;
  --red:#e8352b;--cyan:#0e9fae;--gold:#f2b705;--win:#159a52;--draw:#8b93a1;--loss:#e8352b;
  --disp:'Barlow Condensed','Noto Sans JP',sans-serif;--body:'Noto Sans JP',system-ui,sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none}
a:hover{color:var(--red)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
.top .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 20px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px}
.brand b{font-family:var(--disp);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:var(--disp);font-weight:600;color:#9aa3b2;font-size:12px;letter-spacing:.18em;line-height:1.3}
.rainbow{height:5px;background:linear-gradient(90deg,#36c6d3 0 20%,#e8352b 20% 40%,#f28c1e 40% 60%,#f6d10f 60% 80%,#2bb24c 80%)}
nav{display:flex;margin-left:auto;height:100%}
nav a{display:flex;align-items:center;padding:0 16px;color:#c8ced8;font-weight:700;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-0px}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-bottom-color:var(--red);background:rgba(255,255,255,.06)}
.status{display:flex;align-items:center;gap:6px}
.status button{background:none;border:1px solid #3a414d;color:#fff;font:inherit;font-size:15px;width:32px;height:32px;cursor:pointer}
.status button:hover{border-color:#fff}
.demo-chip{font-size:11px;font-weight:700;background:var(--gold);color:var(--ink);padding:3px 8px;cursor:help;white-space:nowrap}
.pulse{width:8px;height:8px;background:var(--gold);display:inline-block;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}
main{max-width:1200px;margin:0 auto;padding:8px 20px 70px}
h1{font-size:30px;font-weight:900;margin:26px 0 4px;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:15px;font-weight:900;margin:0;letter-spacing:.02em}
h2 small{font-weight:500;color:var(--sub);margin-left:4px}
h3{font-size:15px;margin:18px 0 8px}
h4{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--sub);margin:18px 0 6px;letter-spacing:.06em}
.muted{color:var(--sub)}.small{font-size:12.5px}
.crumb{color:var(--sub);font-size:13px;margin-top:22px;font-weight:700}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin:22px 0 26px;padding:30px 32px;color:#fff;background:
  linear-gradient(100deg,var(--ink) 0 58%,transparent 58%),
  repeating-linear-gradient(115deg,#36c6d3 0 26px,#e8352b 26px 52px,#f28c1e 52px 78px,#f6d10f 78px 104px,#2bb24c 104px 130px),var(--ink);
  position:relative;overflow:hidden;min-height:210px}
.hero:hover{color:#fff}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 57%,rgba(13,17,23,.25) 72%,rgba(13,17,23,.8));pointer-events:none}
.hero>*{position:relative}
.kick{display:inline-block;font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.14em;font-size:15px;color:var(--ink);background:var(--gold);padding:2px 10px}
.hero strong{display:block;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(46px,7vw,84px);line-height:.95;margin:12px 0 8px;letter-spacing:.01em;text-transform:uppercase}
.hero-s{color:#c8ced8;font-weight:700}
.hero-n{display:flex;gap:26px}
.hero-n div{display:flex;flex-direction:column;align-items:flex-end}
.hero-n b{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1}
.hero-n span{font-size:12px;color:#e9edf3;font-weight:700}
/* blocks */
.block{margin-bottom:22px}
.bh{display:flex;align-items:baseline;justify-content:space-between;border-top:4px solid var(--ink);padding:8px 0 10px}
.bh a{font-size:13px;font-weight:700;color:var(--red)}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}.cols>*{min-width:0}
.mini-t td.pts{text-align:right;padding-right:18px}
.card{background:var(--card);border-top:4px solid var(--ink);padding:14px 18px 16px;margin-bottom:20px}
.card h2{margin-bottom:10px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.sc-card{background:var(--card);padding:10px 12px;border-bottom:3px solid var(--rule)}
.scm{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0;color:var(--sub)}
.scr .cl{font-weight:500}
.scr b{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.1}
.scr.w{color:var(--ink)}.scr.w .cl{font-weight:900}
.honours{list-style:none;margin:0;padding:0;background:var(--card)}
.honours li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rule)}
.hn-c{display:flex;align-items:center;gap:8px;font-weight:700}
.hn-c em{font-style:normal;color:var(--sub);font-weight:500;font-size:13px}
.hn-w{display:flex;align-items:center;gap:8px;font-weight:700}
/* badges */
.tb{font-family:var(--disp);font-size:13px;font-weight:800;font-style:italic;letter-spacing:.06em;padding:1px 7px;color:#fff;line-height:1.4;white-space:nowrap}
.tb.league{background:var(--red)}.tb.cup{background:var(--cyan)}
.live{font-size:11px;font-weight:700;color:var(--win);border:1px solid var(--win);padding:0 5px;white-space:nowrap}
.crown{font-family:var(--disp);font-style:italic;font-size:13px;font-weight:800;color:var(--ink);background:var(--gold);padding:1px 8px;letter-spacing:.05em}
.crown.cup{background:var(--cyan);color:#fff}
.gold{color:#b88a00}
.cl{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.cl.big{font-size:22px;font-weight:900}
.chip{width:4px;height:16px;background:var(--c);flex:none}
.pos{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--sub);width:34px}
/* tabs */
.tabs{display:flex;gap:2px;margin:18px 0 0;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.tabs button,.switch button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--sub);font:inherit;font-weight:900;font-size:14px;padding:10px 16px;cursor:pointer}
.tabs button:hover,.switch button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.switch{display:inline-flex;margin:18px 0 0;background:var(--card);border:2px solid var(--ink)}
.switch button{border:0;margin:0;padding:9px 26px}
.switch button.on{background:var(--ink);color:#fff}
.panel{margin-top:14px}
/* tables */
.tw{overflow-x:auto;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--sub);font-weight:700;padding:10px 8px;border-bottom:2px solid var(--ink);text-align:center;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
.l{text-align:left}
td.pts{font-family:var(--disp);font-weight:800;font-size:22px}
tr.zone td{background:#fff8dc}
tr.zone td:first-child{box-shadow:inset 4px 0 var(--gold)}
tr.click{cursor:pointer}
tr.sub td{background:var(--soft);text-align:left;white-space:normal}
.adj{color:var(--red);font-weight:900;font-size:12px;border:1px solid var(--red);padding:0 4px}
.up{color:var(--win);font-weight:700}.down{color:var(--loss);font-weight:700}
.rb{display:inline-grid;place-items:center;width:22px;height:22px;font-size:12px;font-weight:900;margin-right:2px;color:#fff}
.rb.W{background:var(--win)}.rb.D{background:var(--draw)}.rb.L{background:var(--loss)}
.form{display:flex;margin-top:6px}
/* match lists */
.ml{background:var(--card)}
.mr{padding:10px 12px;border-bottom:1px solid var(--rule)}
.mr:last-child{border-bottom:0}
.mm{font-size:12px;color:var(--sub);font-weight:500}
.mg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.mg .h{justify-self:end}.mg .a{justify-self:start}
.mg .h,.mg .a{color:var(--sub)}.mg .win{color:var(--ink)}
.mg .win .cl{font-weight:900}
.mg .s{text-align:center;min-width:84px}
.sc{display:inline-block;font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;background:var(--ink);color:#fff;padding:4px 10px}
.sc b{color:#8b93a1;margin:0 3px;font-weight:600}
.sc.fw{font-family:var(--body);font-size:12px;background:var(--gold);color:var(--ink)}.sc.pending{background:var(--rule);color:var(--sub);font-size:16px}
.mg small{display:block;font-size:11px;color:var(--sub);margin-top:3px;font-weight:700}
.mn{font-size:12px;color:#9a7000;text-align:center}
.rg h4{margin-top:20px}
.empty{color:var(--sub);padding:18px 0}
.champ{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.notes{margin-top:14px;padding:12px 16px;background:var(--card);border-left:4px solid var(--red)}
.notes h4{margin:0 0 6px;color:var(--red)}.notes ul{margin:0;padding-left:18px}
.mxt{table-layout:fixed;min-width:680px}.mxt th:first-child{width:170px}.mxt td{padding:5px 3px}
.mxt td.self{background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 4px,#e8eaee 4px,#e8eaee 8px)}
.mxt th .vt{display:inline-block;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.mx{display:block;font-family:var(--disp);font-weight:700;font-size:17px;padding:1px 3px;margin:1px 0}
.mx.W{background:#d7f2e2}.mx.L{background:#fde0de}.mx.D{background:#eceef1}
.gh{margin-top:22px}
.ccard{display:block;background:var(--card);padding:16px 18px;border-top:4px solid var(--ink);transition:transform .12s}
.ccard:hover{transform:translateY(-2px);color:inherit}
.ccard h3{margin:10px 0 4px;font-size:18px;font-weight:900}.ccard p{margin:4px 0}
.ccard.club{border-top-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.cstat{display:flex;gap:18px;margin:10px 0 4px}
.cstat div{display:flex;flex-direction:column}.cstat span{font-size:11px;color:var(--sub);font-weight:700}
.cstat b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
/* bracket */
.bracket{display:flex;gap:22px;overflow-x:auto;padding-bottom:8px}
.bcol{min-width:230px;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.bcol h4{margin:0;text-align:center}
.bm{background:var(--card);border-left:4px solid var(--ink)}
.bt{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule);color:var(--sub)}
.bt b{font-family:var(--disp);font-weight:800;font-size:22px}.bt small{font-size:13px;margin-left:3px}
.bt.win{color:var(--ink)}.bt.win .cl{font-weight:900}.bt.lose{opacity:.6}
.bd{font-size:11px;color:var(--sub);padding:3px 12px}
/* club head */
.clubhead{margin-top:8px;padding:26px 28px;color:#fff;background:linear-gradient(105deg,var(--ink) 0 62%,var(--c) 62% 66%,var(--ink) 66% 70%,var(--c) 70%)}
.clubhead h1{margin:0 0 14px;font-family:var(--disp);font-weight:900;font-style:italic;font-size:clamp(40px,6vw,64px);line-height:1;text-transform:uppercase}
.clubhead .muted{color:#c8ced8}
.kv{display:flex;gap:30px;flex-wrap:wrap}
.kv>div{display:flex;flex-direction:column}.kv span{font-size:12px;color:#aab2bf;font-weight:700}
.kv b{font-family:var(--disp);font-weight:800;font-size:42px;line-height:1}.kv b em{font-style:normal;font-size:18px;margin-left:2px}.kv small{color:#c8ced8}
.pair{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pair div{flex:1;min-width:220px;background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px}
.pair b{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:26px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.rec dt{color:var(--sub);font-weight:700}.rec dd{margin:0;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.2}
.titles{padding-left:18px;margin:0}
.rl{list-style:none;padding:0;margin:0}
.rl li{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--rule);padding:6px 0}
.rl li:last-child{border-bottom:0}
.rl li>div{flex:1}.rl .mr{border:0;padding:4px 0}
.big{font-family:var(--disp);font-size:28px;font-weight:800;min-width:80px;color:var(--red)}
.chart{background:var(--card);padding:10px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:#e6e8ec;stroke-width:1}.chart .ax{fill:var(--sub);font-size:11px;font-family:var(--body)}
.chart.focus .ser{opacity:.1}.chart.focus .ser.hi{opacity:1}
.card .chart{padding:0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--rule);color:var(--ink);padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.legend button.on{border-color:var(--ink)}
.legend i{width:10px;height:10px}
.spark{width:100px;height:24px}
.cd{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 18px;padding:4px 6px}
.cd b{font-family:var(--disp);font-weight:800;font-size:20px;margin-left:6px;color:var(--red)}.cd p{margin:0}
@media (max-width:860px){
  .cols{grid-template-columns:1fr}
  .top .in{height:auto;flex-wrap:wrap;padding:10px 16px 0;gap:6px}
  nav{order:3;width:100%;margin:0;overflow-x:auto;height:44px}
  .status{margin-left:auto}
  main{padding:6px 16px 60px}
  .hero{grid-template-columns:1fr;padding:22px;background:var(--ink)}
  .hero:before{display:none}
  .hero-n{justify-content:space-between}.hero-n div{align-items:flex-start}
  .mg{gap:6px}.sc{font-size:20px}
  .brand b{font-size:19px}.brand small{font-size:10px}.brand img{width:38px;height:38px}
  .honours li{grid-template-columns:1fr}
  .clubhead{background:linear-gradient(105deg,var(--ink) 0 80%,var(--c) 80%)}
}
</style>
</head>

<script>
// ===== RAL core: data model and calculations (no DOM) =====
const DEFAULT_SETTINGS = {
  win: 3, draw: 1, loss: 0,
  eloInit: 1500, kLeague: 40, kCup: 20,
  cWin: 2, cDraw: 1, cLeague: 6, cLeagueTop: 6, cGroup1: 4, cGroup2: 2, cKo: 1, cSeasons: 5,
  koRounds: ['ラウンド16', '準々決勝', '準決勝', '決勝'],
};
const SETTING_LABELS = {
  '勝ちの勝ち点': 'win', '引き分けの勝ち点': 'draw', '負けの勝ち点': 'loss',
  'レーティング初期値': 'eloInit', 'レーティング係数（リーグ）': 'kLeague', 'レーティング係数（カップ）': 'kCup',
  '係数（勝利）': 'cWin', '係数（引き分け）': 'cDraw', '係数（リーグ参加）': 'cLeague', '係数（リーグ順位・1位）': 'cLeagueTop',
  '係数（カップ予選1位）': 'cGroup1', '係数（カップ予選2位）': 'cGroup2', '係数（決勝トーナメント進出）': 'cKo', '係数の対象シーズン数': 'cSeasons',
  'カップのラウンド順': 'koRounds',
};

function norm(s) { return String(s == null ? '' : s).normalize('NFKC').trim(); }
function keyOf(s) { return norm(s).toLowerCase().replace(/\s+/g, ' '); }
function num(v) {
  if (v === undefined || v === null) return null;
  let s = norm(v).replace(/[−–—]/g, '-').replace(/,/g, '');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function dateKey(v) {
  const s = norm(v);
  if (!s) return '';
  const m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  return s;
}
function fmtDate(k) { return k && /^\d{4}-/.test(k) ? k.replace(/-/g, '/') : (k || ''); }
function roundNum(s) { const m = norm(s).match(/-?\d+/); return m ? Number(m[0]) : null; }

function parseSettings(rows) {
  const st = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  for (const r of rows || []) {
    const k = SETTING_LABELS[norm(r[0])];
    if (!k) continue;
    if (k === 'koRounds') {
      const list = norm(r[1]).split(/[,、]/).map(norm).filter(Boolean);
      if (list.length) st.koRounds = list;
    } else {
      const n = num(r[1]);
      if (n !== null) st[k] = n;
    }
  }
  return st;
}

// raw = {matches, comps, clubs, pens, settings} — each an array of rows (header row included)
function buildModel(raw) {
  const S = parseSettings((raw.settings || []).slice(1));
  const clubs = []; const alias = new Map();
  function addClub(name, extra) {
    const c = { id: clubs.length, name: norm(name), short: '', note: '', founded: '', ...extra };
    clubs.push(c); alias.set(keyOf(c.name), c); return c;
  }
  for (const r of (raw.clubs || []).slice(1)) {
    if (!norm(r[0])) continue;
    if (alias.has(keyOf(r[0]))) continue;
    const c = addClub(r[0], { short: norm(r[1]), founded: norm(r[3]), note: norm(r[4]) });
    for (const a of norm(r[2]).split(/[,、]/).map(norm).filter(Boolean)) if (!alias.has(keyOf(a))) alias.set(keyOf(a), c);
  }
  const club = (name) => { const k = keyOf(name); if (!k) return null; return alias.get(k) || addClub(name); };

  const comps = []; const compById = new Map();
  (raw.comps || []).slice(1).forEach((r, i) => {
    const id = norm(r[0]); if (!id || compById.has(id)) return;
    const c = { id, name: norm(r[1]) || id, type: /カップ|cup/i.test(norm(r[2])) ? 'cup' : 'league', season: norm(r[3]),
      start: dateKey(r[4]), done: norm(r[5]) === '終了', status: norm(r[5]) || '開催中', note: norm(r[6]), row: i, matches: [], pens: [] };
    comps.push(c); compById.set(id, c);
  });
  const getComp = (id) => {
    if (compById.has(id)) return compById.get(id);
    const c = { id, name: id, type: 'league', season: '', start: '', done: false, status: '開催中', note: '', row: 1e6 + comps.length, matches: [], pens: [] };
    comps.push(c); compById.set(id, c); return c;
  };

  const matches = [];
  (raw.matches || []).slice(1).forEach((r, i) => {
    const cid = norm(r[0]); const h = club(r[4]); const a = club(r[7]);
    if (!cid || !h || !a) return;
    const kindS = norm(r[10]);
    if (kindS === '中止') return;
    const comp = getComp(cid);
    const roundS = norm(r[1]); const group = norm(r[2]);
    const m = { row: i, comp, round: roundS, group, date: dateKey(r[3]), home: h, away: a,
      hg: num(r[5]), ag: num(r[6]), pkh: num(r[8]), pka: num(r[9]), note: norm(r[11]),
      fw: kindS.includes('ホーム') && kindS.includes('不戦') ? 'H' : (kindS.includes('アウェイ') && kindS.includes('不戦') ? 'A' : null) };
    m.isGroup = comp.type === 'cup' && (!!group || /^予選/.test(roundS));
    if (m.isGroup && !m.group) m.group = '予選';
    m.rn = roundNum(roundS);
    m.played = !!m.fw || (m.hg !== null && m.ag !== null);
    m.counted = m.played && !m.fw && m.hg !== null && m.ag !== null; // goals/records/elo
    if (m.played) {
      if (m.fw) m.res = m.fw === 'H' ? 'H' : 'A';
      else m.res = m.hg > m.ag ? 'H' : m.hg < m.ag ? 'A' : 'D';
      m.pkWin = m.res === 'D' && m.pkh !== null && m.pka !== null && m.pkh !== m.pka ? (m.pkh > m.pka ? 'H' : 'A') : null;
      m.adv = m.res !== 'D' ? m.res : m.pkWin; // who goes through in a KO tie
    }
    matches.push(m); comp.matches.push(m);
  });

  const pens = [];
  (raw.pens || []).slice(1).forEach((r, i) => {
    const cid = norm(r[0]); const c = club(r[1]); const pts = num(r[2]);
    if (!cid || !c || pts === null) return;
    const comp = getComp(cid);
    const p = { row: i, comp, club: c, pts, rn: num(r[3]), date: dateKey(r[4]), reason: norm(r[5]) };
    pens.push(p); comp.pens.push(p);
  });

  // competition order: start date (or first match date), then sheet order
  for (const c of comps) {
    const ds = c.matches.map(m => m.date).filter(Boolean).sort();
    c.effStart = c.start || ds[0] || '';
    c.lastDate = ds[ds.length - 1] || '';
  }
  comps.sort((a, b) => (a.effStart || '9999') < (b.effStart || '9999') ? -1 : (a.effStart || '9999') > (b.effStart || '9999') ? 1 : a.row - b.row);
  comps.forEach((c, i) => { c.idx = i; });

  // KO round order per cup
  for (const c of comps) {
    if (c.type !== 'cup') continue;
    const present = [];
    for (const m of c.matches) if (!m.isGroup && !present.includes(m.round)) present.push(m.round);
    const ordered = S.koRounds.filter(r => present.includes(r)).concat(present.filter(r => !S.koRounds.includes(r)));
    // final = last in settings list if present, else last ordered
    c.koRounds = ordered;
    c.finalRound = present.includes(S.koRounds[S.koRounds.length - 1]) ? S.koRounds[S.koRounds.length - 1] : ordered[ordered.length - 1] || null;
    c.groups = [...new Set(c.matches.filter(m => m.isGroup).map(m => m.group))].sort();
  }
  for (const m of matches) {
    if (m.comp.type === 'cup') m.ord = m.isGroup ? (m.rn ?? 0) : 1000 + m.comp.koRounds.indexOf(m.round);
    else m.ord = m.rn ?? 0;
  }
  matches.sort((a, b) => a.comp.idx - b.comp.idx || (a.date || '') .localeCompare(b.date || '') || a.ord - b.ord || a.row - b.row);
  matches.forEach((m, i) => { m.seq = i; });
  for (const c of comps) c.matches.sort((a, b) => a.seq - b.seq);

  const model = { S, clubs, comps, compById, matches, pens };
  for (const c of comps) c.clubs = clubsInComp(c);
  for (const c of comps) computeComp(model, c);
  computeElo(model);
  computeTitles(model);
  computeCoef(model);
  for (const cl of clubs) cl.active = matches.some(m => m.home === cl || m.away === cl);
  return model;
}

function clubsInComp(c) {
  const set = new Set();
  for (const m of c.matches) { set.add(m.home); set.add(m.away); }
  for (const p of c.pens) set.add(p.club);
  return [...set];
}

function emptyRow(club) { return { club, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, adj: 0, pens: [] }; }
function addResult(row, gf, ga, r, counted) {
  row.P++; if (r === 'W') row.W++; else if (r === 'D') row.D++; else row.L++;

}
function finishTable(S, rows) {

  rows.sort((a, b) => b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || b.W - a.W || a.club.name.localeCompare(b.club.name));
  rows.forEach((r, i) => { r.pos = i + 1; });
  return rows;
}
function sideResult(m, side) { // 'W','D','L' from perspective of side 'H'/'A'
  if (m.res === 'D') return 'D';
  return m.res === side ? 'W' : 'L';
}
// table for a list of matches (league or group), optionally up to round rn
function tableFor(S, clubList, ms, pens, maxRn = Infinity) {
  const map = new Map(clubList.map(c => [c, emptyRow(c)]));
  const get = c => { if (!map.has(c)) map.set(c, emptyRow(c)); return map.get(c); };
  for (const m of ms) {
    if (!m.played) continue;
    if (maxRn !== Infinity && (m.rn === null || m.rn > maxRn)) continue;
    addResult(get(m.home), m.hg || 0, m.ag || 0, sideResult(m, 'H'), m.counted);
    addResult(get(m.away), m.ag || 0, m.hg || 0, sideResult(m, 'A'), m.counted);
  }
  for (const p of pens || []) {
    if (maxRn !== Infinity && p.rn !== null && p.rn > maxRn) continue;
    const r = get(p.club); r.adj += p.pts; r.pens.push(p);
  }
  return finishTable(S, [...map.values()]);
}

function computeComp(model, c) {
  const S = model.S;
  c.played = c.matches.filter(m => m.played).length;
  c.goals = c.matches.filter(m => m.counted).reduce((s, m) => s + m.hg + m.ag, 0);
  if (c.type === 'league') {
    c.table = tableFor(S, c.clubs, c.matches, c.pens);
    const rns = [...new Set(c.matches.filter(m => m.played && m.rn !== null).map(m => m.rn))].sort((a, b) => a - b);
    c.progress = rns.map(rn => ({ rn, table: tableFor(S, c.clubs, c.matches, c.pens, rn) }));
    c.champion = c.done && c.table.length ? c.table[0].club : null;
    c.result = new Map(c.table.map(r => [r.club, { label: `${r.pos}位`, pos: r.pos, n: c.table.length, row: r }]));
  } else {
    c.groupTables = c.groups.map(g => {
      const ms = c.matches.filter(m => m.isGroup && m.group === g);
      const cl = [...new Set(ms.flatMap(m => [m.home, m.away]))];
      return { group: g, table: tableFor(S, cl, ms, []) };
    });
    const fin = c.finalRound ? c.matches.filter(m => !m.isGroup && m.round === c.finalRound) : [];
    const finM = fin.length === 1 && fin[0].played && fin[0].adv ? fin[0] : null;
    c.finalMatch = fin[0] || null;
    c.champion = finM ? (finM.adv === 'H' ? finM.home : finM.away) : null;
    c.runnerUp = finM ? (finM.adv === 'H' ? finM.away : finM.home) : null;
    const koStarted = c.matches.some(m => !m.isGroup && m.played);
    c.result = new Map();
    for (const cl of c.clubs) {
      const all = c.matches.filter(m => m.home === cl || m.away === cl);
      const row = emptyRow(cl);
      for (const m of all) if (m.played) { const side = m.home === cl ? 'H' : 'A'; addResult(row, side === 'H' ? m.hg || 0 : m.ag || 0, side === 'H' ? m.ag || 0 : m.hg || 0, sideResult(m, side), m.counted); }
      finishTable(S, [row]);
      const ko = all.filter(m => !m.isGroup);
      let label, depth;
      if (cl === c.champion) { label = '優勝'; depth = 100; }
      else if (cl === c.runnerUp) { label = '準優勝'; depth = 99; }
      else if (ko.length) {
        const last = ko.reduce((a, b) => (c.koRounds.indexOf(b.round) > c.koRounds.indexOf(a.round) ? b : a));
        const side = last.home === cl ? 'H' : 'A';
        const lost = last.played && last.adv && last.adv !== side;
        label = last.round === '準決勝' && lost ? 'ベスト4' : last.round === '準々決勝' && lost ? 'ベスト8' : last.round + (lost ? '敗退' : last.played ? '突破' : '進出');
        depth = 10 + c.koRounds.indexOf(last.round);
      } else {
        const gt = c.groupTables.find(g => g.table.some(r => r.club === cl));
        const pos = gt ? gt.table.find(r => r.club === cl).pos : null;
        label = (koStarted || c.done) ? '予選敗退' : (gt ? `予選${gt.group === '予選' ? '' : ' ' + gt.group + '組'} ${pos}位` : '予選');
        depth = 0;
      }
      c.result.set(cl, { label, depth, row });
    }

}

function computeElo(model) {
  const S = model.S; const R = new Map(); const hist = new Map();
  for (const c of model.clubs) { R.set(c, S.eloInit); hist.set(c, []); }
  for (const m of model.matches) {
    if (!m.counted) continue;
    const ra = R.get(m.home), rb = R.get(m.away);
    const ea = 1 / (1 + Math.pow(10, (rb - ra) / 400));
    const sa = m.res === 'H' ? 1 : m.res === 'A' ? 0 : 0.5;
    const gd = Math.abs(m.hg - m.ag);
    const g = gd <= 1 ? 1 : gd === 2 ? 1.5 : (11 + gd) / 8;
    const k = m.comp.type === 'league' ? S.kLeague : S.kCup;
    const d = k * g * (sa - ea);
    m.eloBefore = { h: ra, a: rb }; m.eloDelta = d; m.expH = ea;
    R.set(m.home, ra + d); R.set(m.away, rb - d);
    hist.get(m.home).push({ m, r: ra + d, d });
    hist.get(m.away).push({ m, r: rb - d, d: -d });
  }
  for (const c of model.clubs) { c.elo = R.get(c); c.eloHist = hist.get(c); }
  const ranked = model.clubs.filter(c => c.eloHist.length).sort((a, b) => b.elo - a.elo);
  ranked.forEach((c, i) => { c.eloRank = i + 1; });
  model.eloRanked = ranked;
}

function computeTitles(model) {
  const S = model.S;
  for (const c of model.clubs) c.titles = [];
  const give = (club, comp, kind) => { club.titles.push({ comp, kind }); };
  for (const comp of model.comps) {
    if (comp.type === 'league' && comp.done) {
      const t = comp.table;
      if (t[0]) give(t[0].club, comp, 'リーグ優勝');
      if (t[1]) give(t[1].club, comp, 'リーグ2位');
      if (t[2]) give(t[2].club, comp, 'リーグ3位');
    }
    if (comp.type === 'cup' && comp.champion) {
      give(comp.champion, comp, 'カップ優勝');
      give(comp.runnerUp, comp, 'カップ準優勝');
    }
  }
}


// UEFA-style club coefficient: match points + bonuses, summed over the last N seasons
function computeCoef(model) {
  const S = model.S;
  const seasons = new Map();
  for (const c of model.comps) {
    const key = c.season || c.name + ' ' + c.id;
    if (!seasons.has(key)) seasons.set(key, { key, label: c.season || c.name, comps: [], idx: c.idx });
    seasons.get(key).comps.push(c); c.seasonKey = key;
  }
  const list = [...seasons.values()].sort((a, b) => a.idx - b.idx);
  const win = S.cSeasons > 0 ? list.slice(-S.cSeasons) : list;
  const inWin = new Set(win.map(s => s.key));
  const rows = new Map();
  const row = cl => { if (!rows.has(cl)) rows.set(cl, { club: cl, total: 0, by: new Map(), items: [] }); return rows.get(cl); };
  const add = (cl, comp, pts, what) => {
    if (!pts) return;
    const r = row(cl); r.items.push({ comp, pts, what });
    r.by.set(comp.seasonKey, (r.by.get(comp.seasonKey) || 0) + pts);
    if (inWin.has(comp.seasonKey)) r.total += pts;
  };
  for (const m of model.matches) {
    if (!m.played) continue;
    for (const side of ['H', 'A']) {
      const cl = side === 'H' ? m.home : m.away;
      const r = m.res === 'D' ? 'D' : m.res === side ? 'W' : 'L'; // PK shoot-outs do not count
      add(cl, m.comp, r === 'W' ? S.cWin : r === 'D' ? S.cDraw : 0, r === 'W' ? '勝利' : '引き分け');
    }
  }
  for (const c of model.comps) {
    if (c.type === 'league') {
      for (const cl of c.clubs) add(cl, c, S.cLeague, 'リーグ参加');
      if (c.done && c.table.length > 1) {
        const n = c.table.length;
        for (const r of c.table) add(r.club, c, Math.round(S.cLeagueTop * (n - r.pos) / (n - 1) * 100) / 100, `リーグ${r.pos}位`);
      }
    } else {
      const koStarted = c.matches.some(m => !m.isGroup && m.played);
      if (koStarted || c.done) for (const g of c.groupTables) {
        if (g.table[0]) add(g.table[0].club, c, S.cGroup1, '予選1位');
        if (g.table[1]) add(g.table[1].club, c, S.cGroup2, '予選2位');
      }
      for (const rd of c.koRounds) {
        const cls = new Set(c.matches.filter(m => !m.isGroup && m.round === rd).flatMap(m => [m.home, m.away]));
        for (const cl of cls) add(cl, c, S.cKo, rd + '進出');
      }
    }
  }
  const ranked = [...rows.values()].filter(r => r.items.length).sort((a, b) => b.total - a.total || (b.by.get(win[win.length - 1]?.key) || 0) - (a.by.get(win[win.length - 1]?.key) || 0) || a.club.name.localeCompare(b.club.name));
  for (const r of rows.values()) { r.total = Math.round(r.total * 1000) / 1000; for (const [k, v] of r.by) r.by.set(k, Math.round(v * 1000) / 1000); }
  ranked.sort((a, b) => b.total - a.total || a.club.name.localeCompare(b.club.name));
  ranked.forEach((r, i) => { r.rank = i + 1; r.club.coef = r; });
  model.coef = { seasons: win, allSeasons: list, ranked };
}

// ---- aggregates ----
function clubMatches(model, club) { return model.matches.filter(m => m.played && (m.home === club || m.away === club)); }
function persp(m, club) {
  const side = m.home === club ? 'H' : 'A';

    r: sideResult(m, side), pk: m.pkWin ? (m.pkWin === side ? 'PK勝' : 'PK負') : '' };
}
function allTime(model, type) {
  const rows = new Map();
  for (const m of model.matches) {
    if (!m.played || (type !== 'all' && m.comp.type !== type)) continue;
    for (const side of ['H', 'A']) {
      const c = side === 'H' ? m.home : m.away;
      if (!rows.has(c)) rows.set(c, emptyRow(c));
      addResult(rows.get(c), side === 'H' ? m.hg || 0 : m.ag || 0, side === 'H' ? m.ag || 0 : m.hg || 0, sideResult(m, side), m.counted);
    }

  const list = finishTable(model.S, [...rows.values()]);
  for (const r of list) r.rate = r.P ? r.W / r.P : 0;

}
function headToHead(model, club) {
  const map = new Map();
  for (const m of clubMatches(model, club)) {
    const p = persp(m, club);
    if (!map.has(p.opp)) map.set(p.opp, { opp: p.opp, ...emptyRow(p.opp), list: [] });
    const r = map.get(p.opp); addResult(r, p.gf || 0, p.ga || 0, p.r, m.counted); r.list.push(p);
  }
  const rows = [...map.values()];
  for (const r of rows) { r.GD = r.GF - r.GA; r.rate = r.P ? r.W / r.P : 0; }
  rows.sort((a, b) => b.P - a.P || b.rate - a.rate || a.opp.name.localeCompare(b.opp.name));
  return rows;
}
function streaksFor(model, club) {
  const ms = model.matches.filter(m => m.counted && (m.home === club || m.away === club)).map(m => persp(m, club));
  const best = {};
  const defs = { win: p => p.r === 'W', unbeaten: p => p.r !== 'L', loss: p => p.r === 'L', winless: p => p.r !== 'W', scoring: p => p.gf > 0, clean: p => p.ga === 0 };
  for (const [k, f] of Object.entries(defs)) {
    let cur = 0, start = null, b = { n: 0 };
    ms.forEach((p, i) => {
      if (f(p)) { if (cur === 0) start = i; cur++; if (cur > b.n) b = { n: cur, from: ms[start].m, to: p.m }; }
      else cur = 0;
    });
    b.current = cur; best[k] = b;
  }
  return best;
}
function records(model) {
  const counted = model.matches.filter(m => m.counted);
  const topGoals = [...counted].sort((a, b) => (b.hg + b.ag) - (a.hg + a.ag) || a.seq - b.seq).slice(0, 10);
  const topMargin = [...counted].sort((a, b) => Math.abs(b.hg - b.ag) - Math.abs(a.hg - a.ag) || (b.hg + b.ag) - (a.hg + a.ag) || a.seq - b.seq).slice(0, 10);
  const streakRows = model.clubs.filter(c => c.active).map(c => ({ club: c, s: streaksFor(model, c) }));
  const streaks = {};
  for (const k of ['win', 'unbeaten', 'loss', 'winless', 'clean']) streaks[k] = streakRows.filter(x => x.s[k].n >= 2).sort((a, b) => b.s[k].n - a.s[k].n).slice(0, 8).map(x => ({ club: x.club, ...x.s[k] }));
  const seasonRows = [];
  for (const c of model.comps) if (c.type === 'league' && c.played) for (const r of c.table) seasonRows.push({ comp: c, ...r, PtsRaw: r.Pts - r.adj });
  const by = (f, asc) => [...seasonRows].filter(r => r.P > 0).sort((a, b) => asc ? f(a) - f(b) : f(b) - f(a)).slice(0, 5);
  const season = { pts: by(r => r.Pts), gf: by(r => r.GF), ga: by(r => r.GA, true), w: by(r => r.W), gd: by(r => r.GD) };
  return { topGoals, topMargin, streaks, season };
}
function formOf(model, club, n = 5) { return clubMatches(model, club).slice(-n).map(m => persp(m, club)); }

  return `<div class="cd">${[...by.values()].reverse().map(b => `<div><div>${typeBadge(b.comp)} ${compLink(b.comp)} <b>${fmtC(b.sum)}</b></div><p class="muted small">${[...b.parts].map(([k, v]) => `${esc(k)} ${fmtC(v)}`).join(' · ')}</p></div>`).join('')}</div>`;
}
const sgn = n => (n > 0 ? '+' : '') + n;
const tabs = (name, items, cur) => `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button role="tab" class="${k === cur ? 'on' : ''}" data-tab="${name}" data-v="${k}">${l}</button>`).join('')}</div>`;
const wrap = html => `<div class="tw">${html}</div>`;
const empty = t => `<p class="empty">${t}</p>`;
function roundLabel(m) {
  if (m.comp.type === 'league') return m.rn !== null ? `第${m.rn}節` : esc(m.round);
  if (m.isGroup) return `予選${m.group && m.group !== '予選' ? ' ' + esc(m.group) + '組' : ''}${m.rn !== null ? ' 第' + m.rn + '節' : ''}`;
  return esc(m.round);
}
function scoreHtml(m) {
  if (!m.played) return '<span class="sc pending">vs</span>';
  if (m.fw && !m.counted) return `<span class="sc fw">${m.fw === 'H' ? '◀ ' : ''}不戦勝${m.fw === 'A' ? ' ▶' : ''}</span>`;
  const pk = m.pkh !== null && m.pka !== null ? `<small>PK ${m.pkh}-${m.pka}</small>` : '';
  return `<span class="sc">${m.hg}<b>-</b>${m.ag}</span>${pk}`;
}
function matchRow(m, opts = {}) {
  const hw = m.played && m.adv === 'H', aw = m.played && m.adv === 'A';
  return `<div class="mr">
    ${opts.meta !== false ? `<div class="mm">${opts.comp ? compLink(m.comp) + ' · ' : ''}${roundLabel(m)}${m.date ? ' · ' + fmtDate(m.date) : ''}</div>` : ''}
    <div class="mg"><span class="h ${hw ? 'win' : ''}">${clubLink(m.home)}</span><span class="s">${scoreHtml(m)}</span><span class="a ${aw ? 'win' : ''}">${clubLink(m.away)}</span></div>
    ${m.note ? `<div class="mn">${esc(m.note)}</div>` : ''}</div>`;
}
function matchList(ms, opts = {}) {
  if (!ms.length) return empty('試合がまだありません');
  if (opts.group === false) return `<div class="ml">${ms.map(m => matchRow(m, opts)).join('')}</div>`;
  const groups = []; let cur = null;
  for (const m of ms) { const k = roundLabel(m); if (!cur || cur.k !== k) { cur = { k, ms: [] }; groups.push(cur); } cur.ms.push(m); }
  return groups.map(g => `<div class="rg"><h4>${g.k}</h4><div class="ml">${g.ms.map(m => matchRow(m, { meta: false })).join('')}</div></div>`).join('');
}
function standings(rows, opts = {}) {
  if (!rows.length) return empty('まだ試合がありません');
  const hl = opts.highlight;
  return wrap(`<table class="st"><thead><tr><th>#</th><th class="l">クラブ</th><th>試</th><th>勝</th><th>分</th><th>負</th><th>得</th><th>失</th><th>差</th>${opts.rate ? '<th>勝率</th>' : ''}<th>勝点</th></tr></thead><tbody>
  ${rows.map(r => `<tr class="${hl === r.club ? 'hl' : ''} ${opts.zone && r.pos <= opts.zone ? 'zone' : ''}"><td class="pos">${r.pos}</td><td class="l">${clubLink(r.club)}${r.adj ? ` <span class="adj" title="${esc(r.pens.map(p => p.reason || '処分').join(' / '))}">${sgn(r.adj)}</span>` : ''}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GF}</td><td>${r.GA}</td><td>${sgn(r.GD)}</td>${opts.rate ? `<td>${pct(r.rate)}</td>` : ''}<td class="pts">${r.Pts}</td></tr>`).join('')}
  </tbody></table>`);
}

// ---------- charts ----------
function lineChart({ series, xLabels, invert, yMin, yMax, height = 280, yFmt = v => v, id, width = 760 }) {
  const W = width, H = height, L = 44, R = 12, T = 14, B = 28;
  const xs = xLabels.length;
  const X = i => L + (xs <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (xs - 1));
  const Y = v => { const t = (v - yMin) / (yMax - yMin || 1); return invert ? T + t * (H - T - B) : H - B - t * (H - T - B); };
  const ticks = []; const step = invert ? (yMax - yMin > 12 ? 2 : 1) : Math.max(25, Math.ceil((yMax - yMin) / 6 / 25) * 25);
  for (let v = invert ? yMin : Math.ceil(yMin / step) * step; v <= yMax; v += step) ticks.push(v);
  const xt = []; const xs2 = Math.max(1, Math.ceil(xs / 10)); for (let i = 0; i < xs; i += xs2) xt.push(i);
  return `<div class="chart" id="${id || ''}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 8}" y="${Y(v) + 4}" class="ax" text-anchor="end">${yFmt(v)}</text>`).join('')}
    ${xt.map(i => `<text x="${X(i)}" y="${H - 8}" class="ax" text-anchor="middle">${esc(xLabels[i])}</text>`).join('')}
    ${series.map((s, si) => `<g class="ser" data-s="${si}"><polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" points="${s.points.map(([i, v]) => X(i) + ',' + Y(v)).join(' ')}"/>
      ${s.points.map(([i, v], k) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${s.points.length > 40 ? 0 : 3.2}" fill="${s.color}"><title>${esc(s.name)} ${esc(xLabels[i])}: ${yFmt(v)}${s.tips ? '\n' + esc(s.tips[k]) : ''}</title></circle>`).join('')}</g>`).join('')}
  </svg>${series.length > 1 ? `<div class="legend">${series.map((s, si) => `<button data-hl="${si}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join('')}</div>` : ''}</div>`;
}

function penNotes(c) {

function matrix(c) {

  };

function progChart(c) {

}

    <section class="card"><h2>レートの推移</h2>${chart}</section>

      <dt>最長連勝</dt><dd>${s.win.n}</dd><dt>最長無敗</dt><dd>${s.unbeaten.n}</dd><dt>最長連敗</dt><dd>${s.loss.n}</dd><dt>最長連続無失点</dt><dd>${s.clean.n}</dd>
      <dt>現在の連続</dt><dd>${s.win.current ? s.win.current + '連勝中' : s.unbeaten.current ? s.unbeaten.current + '試合無敗' : s.loss.current ? s.loss.current + '連敗中' : '–'}</dd></dl>
      ${c.titles.length ? `<h3>タイトル</h3><ul class="titles">${c.titles.map(x => `<li><span class="${/優勝/.test(x.kind) ? 'gold' : 'muted'}">${x.kind}</span> ${compLink(x.comp)}</li>`).join('')}</ul>` : ''}</section>
  </div>`;
}

function pageRanking() {
  const S = MODEL.S, t = ui.rankTab;
  let body = '';
  if (t === 'elo') {
    const r = MODEL.eloRanked;
    body =       (r.length ? wrap(`<table class="st"><thead><tr><th>#</th><th class="l">クラブ</th><th>レート</th><th>試合</th><th>直近5試合</th><th class="l">推移</th></tr></thead><tbody>${r.map(c => {
        const last5 = c.eloHist.slice(-5).reduce((s, h) => s + h.d, 0);
        const pts = c.eloHist.slice(-20).map(h => h.r); const mn = Math.min(...pts), mx = Math.max(...pts);
        const spark = pts.length > 1 ? `<svg class="spark" viewBox="0 0 100 24"><polyline fill="none" stroke="${color(c)}" stroke-width="1.6" points="${pts.map((v, i) => (i * 100 / (pts.length - 1)).toFixed(1) + ',' + (22 - (v - mn) / (mx - mn || 1) * 20).toFixed(1)).join(' ')}"/></svg>` : '';
        return `<tr><td class="pos">${c.eloRank}</td><td class="l">${clubLink(c)}</td><td class="pts">${Math.round(c.elo)}</td><td>${c.eloHist.length}</td><td class="${last5 >= 0 ? 'up' : 'down'}">${sgn(Math.round(last5))}</td><td class="l">${spark}</td></tr>`;
      }).join('')}</tbody></table>`) : empty('試合がまだありません'));
  }
  if (t === 'coef') {
    const C = MODEL.coef; const ss = C.seasons;
    const f = v => v === undefined ? '–' : fmtC(v);
    const cnt = (c, k) => c.titles.filter(x => x.kind === k).length;
    body =       (C.ranked.length ? wrap(`<table class="st"><thead><tr><th>#</th><th class="l">クラブ</th><th>Pt</th>${ss.map(x => `<th>${esc(x.label)}</th>`).join('')}<th>リーグ優勝</th><th>カップ優勝</th></tr></thead><tbody>${C.ranked.map(r => `<tr class="click" data-coef="${r.club.id}"><td class="pos">${r.rank}</td><td class="l">${clubLink(r.club)}</td><td class="pts">${fmtC(r.total)}</td>${ss.map(x => `<td>${f(r.by.get(x.key))}</td>`).join('')}<td>${cnt(r.club, 'リーグ優勝') || ''}</td><td>${cnt(r.club, 'カップ優勝') || ''}</td></tr>
      ${ui.coefOpen === r.club.id ? `<tr class="sub"><td colspan="${ss.length + 5}">${coefDetail(r)}</td></tr>` : ''}`).join('')}</tbody></table>`) : empty('試合がまだありません'));
  }
  if (t === 'all') {
    body = tabs('rankType', [['all', '全大会'], ['league', 'リーグ'], ['cup', 'カップ']], ui.rankType) + standings(allTime(MODEL, ui.rankType), { rate: true });
  }
  return `<h1>ランキング</h1>${tabs('rank', [['coef', '総合'], ['elo', 'レーティング'], ['all', '通算成績']], t)}<div class="panel">${body}</div>`;
}

function pageRecords() {
  const R = records(MODEL), t = ui.recTab;
  const mline = (m, v) => `<li><b class="big">${v}</b><div>${matchRow(m, { comp: true })}</div></li>`;
  let body = '';
  if (t === 'match') body = `<div class="cols"><section class="card"><h2>最多得点の試合</h2><ol class="rl">${R.topGoals.map(m => mline(m, m.hg + m.ag + '点')).join('') || empty('–')}</ol></section>
    <section class="card"><h2>最大点差</h2><ol class="rl">${R.topMargin.map(m => mline(m, Math.abs(m.hg - m.ag) + '点差')).join('') || empty('–')}</ol></section></div>`;
  if (t === 'streak') {
    const blk = (k, title, unit) => `<section class="card"><h2>${title}</h2><ol class="rl">${R.streaks[k].map(x => `<li><b class="big">${x.n}${unit}</b><div>${clubLink(x.club)}<p class="muted small">${fmtDate(x.from.date) || compName(x.from.comp)} 〜 ${fmtDate(x.to.date) || compName(x.to.comp)}${x.current === x.n ? ' <span class="live">継続中</span>' : ''}</p></div></li>`).join('') || empty('–')}</ol></section>`;
    body = `<div class="cols">${blk('win', '連勝', '連勝')}${blk('unbeaten', '無敗', '試合')}${blk('clean', '連続無失点', '試合')}${blk('loss', '連敗', '連敗')}</div>`;
  }
  if (t === 'season') {
    const blk = (k, title, f) => `<section class="card"><h2>${title}</h2><ol class="rl">${R.season[k].map(r => `<li><b class="big">${f(r)}</b><div>${clubLink(r.club)}<p class="muted small">${compLink(r.comp)} · ${r.P}試合${r.comp.done ? '' : ' · 開催中'}</p></div></li>`).join('') || empty('–')}</ol></section>`;
    body = `<div class="cols">${blk('pts', '最多勝ち点', r => r.Pts)}${blk('w', '最多勝利', r => r.W + '勝')}${blk('gf', '最多得点', r => r.GF)}${blk('ga', '最少失点', r => r.GA)}${blk('gd', '最大得失点差', r => sgn(r.GD))}</div>`;
  }
  if (t === 'pens') {
    const ps = MODEL.pens;
    body = ps.length ? wrap(`<table class="st"><thead><tr><th class="l">大会</th><th class="l">クラブ</th><th>勝ち点</th><th>適用節</th><th>日付</th><th class="l">内容</th></tr></thead><tbody>${ps.map(p => `<tr><td class="l">${compLink(p.comp)}</td><td class="l">${clubLink(p.club)}</td><td><span class="adj">${sgn(p.pts)}</span></td><td>${p.rn ?? '–'}</td><td>${fmtDate(p.date) || '–'}</td><td class="l">${esc(p.reason)}</td></tr>`).join('')}</tbody></table>`) + `<h3 class="gh">不戦勝・不戦敗</h3>` + matchList(MODEL.matches.filter(m => m.fw), { group: false, comp: true }) : empty('処分の記録はありません');
  }
  return `<h1>記録</h1>${tabs('rec', [['match', '試合'], ['streak', '連続記録'], ['season', 'シーズン記録'], ['pens', '処分・不戦']], t)}<div class="panel">${body}</div>`;
}

// ---------- router ----------
function route() {
  const h = (location.hash || '#home').slice(1);
  let html, nav = h.split('-')[0];
  if (!MODEL) { $('#main').innerHTML = '<p class="empty">読み込み中…</p>'; return; }
  if (h === 'home' || h === '') html = pageHome();
  else if (h === 'comps') html = pageComps();
  else if (/^comp-\d+$/.test(h)) { html = pageComp(+h.slice(5)); nav = 'comps'; }
  else if (h === 'clubs') html = pageClubs();
  else if (/^club-\d+$/.test(h)) { html = pageClub(+h.slice(5)); nav = 'clubs'; }
  else if (h === 'ranking') html = pageRanking();
  else if (h === 'records') html = pageRecords();
  else html = pageHome();
  $('#main').innerHTML = html;
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + (nav === 'home' || nav === '' ? 'home' : nav)));
}
let lastHash = null;
window.addEventListener('hashchange', () => { if (location.hash !== lastHash) { ui.h2hOpen = null; } lastHash = location.hash; route(); window.scrollTo(0, 0); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) {
    const n = b.dataset.tab, v = b.dataset.v;
    if (n.startsWith('comp:')) ui.compTab[n.slice(5)] = v;
    else if (n === 'compFilter') ui.compFilter = v;
    else if (n === 'club') ui.clubTab = v;
    else if (n === 'rank') ui.rankTab = v;
    else if (n === 'rankType') ui.rankType = v;
    else if (n === 'rec') ui.recTab = v;
    route(); return;
  }
  const hl = e.target.closest('[data-hl]');
  if (hl) { const ch = hl.closest('.chart'); const on = hl.classList.toggle('on'); ch.querySelectorAll('.legend button').forEach(x => { if (x !== hl) x.classList.remove('on'); }); ch.classList.toggle('focus', on); ch.querySelectorAll('.ser').forEach(g => g.classList.toggle('hi', on && g.dataset.s === hl.dataset.hl)); return; }
  const co = e.target.closest('[data-coef]');
  if (co && !e.target.closest('a')) { const id = +co.dataset.coef; ui.coefOpen = ui.coefOpen === id ? null : id; route(); return; }
  const r = e.target.closest('[data-h2h]');
  if (r && !e.target.closest('a')) { const id = +r.dataset.h2h; ui.h2hOpen = ui.h2hOpen === id ? null : id; route(); return; }
  if (e.target.closest('#reload')) { load(true); }
  if (e.target.closest('#approve')) { load(true); }
});

// ---------- data loading ----------
function valuesFrom(p) {
  if (p == null) return [];
  if (typeof p === 'string') { try { return valuesFrom(JSON.parse(p)); } catch { return []; } }
  if (Array.isArray(p.values)) return p.values;
  if (p.content && !Array.isArray(p.content)) return valuesFrom(p.content);
  if (Array.isArray(p.content)) { for (const b of p.content) if (b && b.type === 'text') { const v = valuesFrom(b.text); if (v.length) return v; } }
  if (p.structuredContent) return valuesFrom(p.structuredContent);
  return [];
}
function setStatus() {
  const el = $('#status');
  if (SOURCE.mode === 'loading') { el.innerHTML = '<span class="pulse"></span>'; el.className = 'status loading'; return; }
  if (SOURCE.mode === 'sheet') { el.innerHTML = `<button id="reload" title="最新に更新" aria-label="最新に更新">↻</button>`; el.className = 'status'; return; }
  el.innerHTML = `<span class="demo-chip" title="${esc(SOURCE.note)}">見本データ</span>${SOURCE.error === 'approval_required' ? '<button id="approve">読み込む</button>' : SOURCE.canRetry ? '<button id="reload" aria-label="再読み込み">↻</button>' : ''}`;
  el.className = 'status demo';
}
const ERR = {
  needs_reauth: 'Google Sheets の接続が切れています。claude.ai の 設定 → コネクタ で再接続してください。',
  server_not_connected: 'Google Sheets のコネクタが追加されていません。claude.ai の 設定 → コネクタ で追加してください。',
  selection_required: 'Google Sheets のコネクタが複数あります。画面の案内からどれを使うか選んでください。',
  not_in_manifest: 'このページでの Google Sheets の利用が許可されていません。',
  blocked_by_policy: '組織の設定で Google Sheets の利用が止められています。',
  approval_required: 'スプレッドシートを読むには許可が必要です。',
  tool_error: 'スプレッドシートを読めませんでした。シートを閲覧できるアカウントか確認してください。',
};
// ---- CSV loading (GitHub Pages / any normal web host) ----
const CFG = window.RAL_CONFIG || {};
const TABS = { matches: ['試合結果', 0], comps: ['大会', 1], clubs: ['クラブ', 2], pens: ['処分', 3], settings: ['設定', 4] };
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
function csvUrl(name, gid, bust) {
  const pub = String(CFG.publishedUrl || '').match(/\/spreadsheets\/d\/e\/([^/]+)/);
  const t = bust ? '&t=' + Date.now() : '';
  if (pub) return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?gid=${gid}&single=true&output=csv${t}`;
  return `https://docs.google.com/spreadsheets/d/${CFG.sheetId || SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}${t}`;
}
async function loadCsv(refresh) {
  try {
    const keys = Object.keys(TABS); const raw = {};
    await Promise.all(keys.map(async k => {
      const res = await fetch(csvUrl(TABS[k][0], TABS[k][1], refresh), { cache: refresh ? 'no-store' : 'default' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error('not csv');
      raw[k] = parseCsv(text);
    }));
    const model = buildModel(raw);
    if (!model.matches.length) return useDemo('シートの「試合結果」にまだ結果がありません。', null, true);
    MODEL = model; SOURCE = { mode: 'sheet', storedAt: Date.now() }; setStatus(); route();
  } catch (e) {
    useDemo('スプレッドシートを読み込めませんでした。シートの共有設定か、config.js の URL を確認してください。', null, true);
  }
}

async function load(refresh) {
  SOURCE = { mode: 'loading' }; setStatus();
  if (!(window.claude && window.claude.use)) return loadCsv(refresh);
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch { mcp = null; }
  if (!mcp) return useDemo('この表示環境ではスプレッドシートを読み込めません。claude.ai 上で開くと読み込めます。', null, false);
  try {
    const keys = Object.keys(RANGES); let storedAt = null;
    const res = await Promise.all(keys.map(k => mcp.callTool(SERVER, 'get_values', { spreadsheetId: SHEET_ID, range: RANGES[k] }, { cache: { staleTime: refresh ? 0 : 120000, gcTime: 604800000, refresh: !!refresh } })));
    const raw = {};
    keys.forEach((k, i) => { raw[k] = valuesFrom(res[i].payload !== undefined ? res[i].payload : res[i]); if (res[i].cache) storedAt = Math.min(storedAt || Infinity, res[i].cache.storedAt); });
    const model = buildModel(raw);
    if (!model.matches.length) return useDemo('シートの「試合結果」にまだ結果がないため、見本を表示しています。結果を入れて「もう一度読み込む」を押すと切り替わります。', null, true);
    MODEL = model; SOURCE = { mode: 'sheet', storedAt: storedAt || Date.now() }; setStatus(); route();
  } catch (e) {
    const code = e && e.code;
    if (code === 'server_unavailable' && e.retryable && !refresh) { setTimeout(() => load(true), (e.retryAfterMs || 1500) + Math.random() * 800); return; }
    useDemo(ERR[code] || ('スプレッドシートを読み込めませんでした' + (e && e.message ? '（' + e.message + '）' : '') + '。'), code, true);
  }
}
function useDemo(note, err, canRetry) {
  MODEL = buildModel(demoRaw()); SOURCE = { mode: 'demo', note, error: err, canRetry }; setStatus(); route();
}
lastHash = location.hash; route(); load(false);

</script>
